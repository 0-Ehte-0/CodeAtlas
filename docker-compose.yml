services:

  postgres:
    image: pgvector/pgvector:pg16
    container_name: codeatlas-postgres
    environment:
      POSTGRES_USER: codeatlas
      POSTGRES_PASSWORD: codeatlas
      POSTGRES_DB: codeatlas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    container_name: codeatlas-neo4j
    environment:
      NEO4J_AUTH: neo4j/codeatlas
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  redis:
    image: redis:7
    container_name: codeatlas-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs: